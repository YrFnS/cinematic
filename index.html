<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#05080b"><meta name="description" content="SENTINEL — an interactive real-time journey through a monolithic temple of stone, water and light."><title>SENTINEL — The Temple Remembers</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05080b;color:#f3efe5;font-family:ui-monospace,monospace}.gate{position:fixed;inset:0;display:grid;place-content:center;justify-items:center;gap:16px;font-size:9px;letter-spacing:.25em}.gate i{width:74px;height:74px;border:1px solid #f1c77e;border-radius:50%;box-shadow:0 0 34px rgba(241,199,126,.12);animation:s 3s linear infinite}@keyframes s{to{transform:rotate(360deg)}}.gate span{color:rgba(243,239,229,.55)}</style></head><body><div class="gate"><i></i><span>ENTERING SENTINEL</span></div><script>
(async()=>{try{const paths=['00','01','02','03','04','05'].map(n=>`./payload/${n}.txt`);const responses=await Promise.all(paths.map(p=>fetch(p,{cache:'no-store'})));if(responses.some(r=>!r.ok))throw new Error('payload unavailable');const html=(await Promise.all(responses.map(r=>r.text()))).join('');document.open();document.write(html);document.close()}catch(error){document.body.innerHTML='<div class="gate"><span>THE WORLD COULD NOT OPEN. RELOAD TO TRY AGAIN.</span></div>';console.error('[SENTINEL loader]',error)}})();
</script></body></html>
